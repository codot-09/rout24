name: CI/CD Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl stop rout24
            sudo rm -f /srv/rout24.jar /srv/rout24.log /srv/rout24-error.log
            sudo mv /home/runner/work/rout24/rout24/target/rout24.jar /srv/rout24.jar
            sudo systemctl daemon-reload
            sudo systemctl start rout24
            sudo systemctl status rout24 --no-pager
